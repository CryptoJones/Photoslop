name: Photoslop-iPadOS

options:
  bundleIdPrefix: io.ronin48
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: "22002"
    MARKETING_VERSION: "2.20.2"
    DEVELOPMENT_TEAM: J6P99Q4479

targets:
  PhotoslopIPad:
    type: application
    platform: iOS
    productName: Photoslop
    sources:
      - path: Photoslop
    dependencies:
      # The QuickLook extension rides inside the app bundle; embedding it is
      # what makes Files show document previews (#267).
      - target: PhotoslopThumbnails
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ronin48.photoslop.ipad
        PRODUCT_NAME: Photoslop
        PRODUCT_MODULE_NAME: PhotoslopIPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Photoslop/Info.plist
      properties:
        CFBundleDisplayName: Photoslop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Photoslop Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - io.ronin48.photoslop.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.ronin48.photoslop.project
            UTTypeDescription: Photoslop Project
            UTTypeConformsTo:
              - com.apple.package
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - photoslop
              public.mime-type:
                - application/vnd.photoslop.project
        LSApplicationCategoryType: public.app-category.graphics-design
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSPhotoLibraryUsageDescription: Photoslop imports images you choose for editing.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

  # Files shows a generic icon for every .photoslop package without this: a
  # package is a folder, and nothing tells the system which file inside it is
  # a picture. The editor writes a flattened preview.png at save time, and
  # this extension hands it to QuickLook (#267). Its own bundle id means its
  # own provisioning profile at release time — automatic provisioning creates
  # it through the same API the app's comes from.
  PhotoslopThumbnails:
    type: app-extension
    platform: iOS
    sources:
      - path: PhotoslopThumbnails
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ronin48.photoslop.ipad.thumbnails
        PRODUCT_NAME: PhotoslopThumbnails
        PRODUCT_MODULE_NAME: PhotoslopThumbnails
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: PhotoslopThumbnails/Info.plist
      properties:
        CFBundleDisplayName: Photoslop Thumbnails
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - io.ronin48.photoslop.project
            QLThumbnailMinimumDimension: 0

  PhotoslopIPadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoslopTests
    dependencies:
      - target: PhotoslopIPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ronin48.photoslop.ipad.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Toolbar reachability depends on the width of a real navigation bar, so it
  # can only be checked by driving the running app.
  PhotoslopIPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhotoslopUITests
    dependencies:
      - target: PhotoslopIPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ronin48.photoslop.ipad.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: PhotoslopIPad

schemes:
  PhotoslopIPad:
    build:
      targets:
        PhotoslopIPad: all
        PhotoslopIPadTests: [test]
        PhotoslopIPadUITests: [test]
    test:
      gatherCoverageData: true
      # keepAlways, or the store-screenshot staging run's attachments are
      # discarded the moment the run passes — which is the only time they are
      # wanted (#257).
      attachmentLifetime: keepAlways
      targets:
        - PhotoslopIPadTests
        - PhotoslopIPadUITests
    archive:
      config: Release
