name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Qt runtime libraries
        run: scripts/install-ci-qt-linux.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Sync locked development environment
        run: uv sync --extra dev --locked
      - name: Verify release versions and workflow policy
        run: uv run python scripts/check-version.py
      - name: Lint
        run: uv run ruff check .
      - name: Formatting baseline
        run: uv run ruff format --check .
      # The iOS About shows the mascot the desktop draws in code, exported to an
      # asset catalogue. Nothing else would notice the two drifting apart.
      - name: iOS mascot asset matches the code that draws it
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/render-ios-mascot.py --check
      - name: Deprecations are errors in the cleared CLI surface
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run pytest -q tests/test_cli_options.py tests/test_cli_combinations.py
          -W error::DeprecationWarning

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-15
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: scripts/install-ci-qt-linux.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Sync locked development environment
        run: uv sync --extra dev --locked --python ${{ matrix.python }}
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q --junitxml=reports/tests.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ runner.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: reports/

  # Everything above runs QT_QPA_PLATFORM=offscreen, which is exactly the gap
  # #274 names: window creation, exposure, HiDPI scale factors and the menu
  # bar had no coverage on the half of the app a person sees first. This job
  # gives the windowed tests a real window system — xvfb's X server on Linux,
  # the native window server on macOS — and only tests/test_windowed.py runs
  # against it; the rest of the suite already has its offscreen legs above.
  windowed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: xcb
            runner-prefix: xvfb-run --auto-servernum
          - os: macos-15
            platform: cocoa
            runner-prefix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Qt runtime libraries, an X server, and xcb
        if: runner.os == 'Linux'
        run: |
          scripts/install-ci-qt-linux.sh
          # The offscreen platform needs none of this; the xcb platform needs
          # all of it, and xvfb is the screen itself.
          sudo apt-get install -y --no-install-recommends \
            xvfb libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Sync locked development environment
        run: uv sync --extra dev --locked
      - name: Windowed tests
        env:
          PHOTOSLOP_WINDOWED_TESTS: "1"
          QT_QPA_PLATFORM: ${{ matrix.platform }}
        run: ${{ matrix.runner-prefix }} uv run pytest -q tests/test_windowed.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Qt runtime libraries
        run: scripts/install-ci-qt-linux.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: uv build
      - name: Install wheel outside the source tree and smoke the CLI
        run: |
          uv venv --python 3.12 .artifact-wheel
          uv pip install --python .artifact-wheel/bin/python dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          "$GITHUB_WORKSPACE/.artifact-wheel/bin/photoslop-cli" --version
          "$GITHUB_WORKSPACE/.artifact-wheel/bin/photoslop-cli" \
            --new 8x8 --fill '19,87,155' --output smoke.png
          test -s smoke.png
      - name: Install source distribution outside the source tree
        run: |
          uv venv --python 3.12 .artifact-sdist
          uv pip install --python .artifact-sdist/bin/python dist/*.tar.gz
          .artifact-sdist/bin/photoslop-cli --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/

  critical-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Qt runtime libraries
        run: scripts/install-ci-qt-linux.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - name: Measure failure-prone modules with branch coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p reports
          # Measure against the whole suite, not a hand-picked file list. The
          # previous list omitted tests that exercise measured modules — e.g.
          # tests/test_services.py, while photoslop.services carries a floor —
          # so the reported percentages understated real coverage and the
          # floors in scripts/check-critical-coverage.py were calibrated to
          # that understatement rather than to the code's actual test debt.
          uv run pytest -q tests/ \
            --cov=photoslop.atomicio --cov=photoslop.commands \
            --cov=photoslop.document --cov=photoslop.io_ora \
            --cov=photoslop.io_svg --cov=photoslop.tasks \
            --cov=photoslop.modeladapter --cov=photoslop.resources \
            --cov=photoslop.server --cov=photoslop.recovery \
            --cov=photoslop.services \
            --cov-report=json:reports/critical-coverage.json
          uv run python scripts/check-critical-coverage.py \
            reports/critical-coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-coverage-${{ github.sha }}
          path: reports/critical-coverage.json

  smoke-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Qt runtime libraries
        run: scripts/install-ci-qt-linux.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - name: Scaled algorithm smoke reports (not full-scale evidence)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p reports
          uv run python -m photoslop.benchmarks 4k-50 \
            --scale 0.01 --samples 5 --enforce > reports/smoke-4k-50.json
          uv run python -m photoslop.benchmarks 12k-20 \
            --scale 0.01 --samples 5 --enforce > reports/smoke-12k-20.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-benchmarks-${{ github.sha }}
          path: reports/

  optional-gmic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Qt runtime libraries
        run: scripts/install-ci-qt-linux.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra gmic --locked
      - name: Exercise the optional G'MIC backend where its wheel is supported
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q tests/test_gmicpack.py
