name: full-scale-performance

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Qt runtime libraries
        run: scripts/install-ci-qt-linux.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - name: Full-resolution latency, memory, output, and cancellation gates
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p reports
          uv run python -m photoslop.benchmarks 4k-10 \
            --samples 5 --enforce > reports/full-4k-10.json
          uv run python -m photoslop.benchmarks 12mp-4 \
            --samples 5 --enforce > reports/full-12mp-4.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-scale-performance-${{ github.sha }}
          path: reports/
