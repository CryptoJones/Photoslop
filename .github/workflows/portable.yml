name: portable

on:
  workflow_dispatch:
    inputs:
      verify_macos_signing:
        description: Import the protected Developer ID identity and sign the macOS validation artifact
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "photoslop/**"
      - "scripts/build-portable-*"
      - "scripts/generate-bundle-metadata.py"
      - "pyproject.toml"
      - "uv.lock"
      # Both builders embed these into the shipped archive, so a change to
      # either one is a change to the artifact and must rebuild it.
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/portable.yml"
  schedule:
    - cron: "23 6 * * 1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PHOTOSLOP_REQUIRE_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_macos_signing)) && '1' || '0' }}
      # v1.30.0 shipped Developer ID signed but not notarized, before notary
      # credentials existed. They are configured now, so every later tag must
      # notarize; the historical exception stays only for a v1.30.0 re-run.
      PHOTOSLOP_REQUIRE_NOTARIZATION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v1.30.0' && '1' || '0' }}
      # Only v1.30.0 carries the qualifier now. A signing dispatch notarizes too,
      # so labelling its archive SIGNED-NOT-NOTARIZED would misdescribe it.
      PHOTOSLOP_ARTIFACT_QUALIFIER: ${{ github.ref_name == 'v1.30.0' && 'SIGNED-NOT-NOTARIZED' || '' }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
      PHOTOSLOP_APPLE_ID: ${{ secrets.PHOTOSLOP_APPLE_ID }}
      PHOTOSLOP_APPLE_TEAM_ID: ${{ secrets.PHOTOSLOP_APPLE_TEAM_ID }}
      PHOTOSLOP_APPLE_APP_PASSWORD: ${{ secrets.PHOTOSLOP_APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No step here pushes; gh authenticates with GH_TOKEN. Leaving the
        # write-capable token in .git/config would only widen what a later
        # step — or a packaged artifact — could reach.
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check-version.py
      - name: Import Developer ID identity
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_macos_signing)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: ./scripts/import-macos-signing-certificate.sh
      - run: ./scripts/build-portable-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Photoslop-macOS-portable${{ github.ref_name == 'v1.30.0' && '-SIGNED-NOT-NOTARIZED' || '' }}
          path: |
            dist/portable-macos/*.zip
            dist/portable-macos/*.sha256
            dist/portable-macos/*.json
            dist/portable-macos/THIRD_PARTY_NOTICES.md
      - name: Remove temporary signing keychain
        if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.verify_macos_signing))
        run: security delete-keychain "$RUNNER_TEMP/photoslop-signing.keychain-db" 2>/dev/null || true

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # There is no Authenticode certificate for this project, so demanding one
      # on a tag cannot ever succeed — it only fails the release. Windows tags
      # therefore ship an archive with UNSIGNED in its filename, which is honest
      # about what it is, rather than a build that never happens.
      #
      # This was a per-tag allowlist and it broke exactly the way an allowlist
      # does: v2.0.1 was cut after the list was written for v2.0.0, the waiver
      # missed, and the release job was skipped. Signing turns back on when
      # PHOTOSLOP_WINDOWS_CERT_BASE64 exists, not when someone remembers to edit
      # a list. See issue #210.
      PHOTOSLOP_REQUIRE_SIGNING: "0"
      PHOTOSLOP_ARTIFACT_QUALIFIER: ${{ startsWith(github.ref, 'refs/tags/v') && 'UNSIGNED' || '' }}
      PHOTOSLOP_WINDOWS_CERT_BASE64: ${{ secrets.PHOTOSLOP_WINDOWS_CERT_BASE64 }}
      PHOTOSLOP_WINDOWS_CERT_PASSWORD: ${{ secrets.PHOTOSLOP_WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No step here pushes; gh authenticates with GH_TOKEN. Leaving the
        # write-capable token in .git/config would only widen what a later
        # step — or a packaged artifact — could reach.
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check-version.py
      - shell: pwsh
        run: ./scripts/build-portable-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Photoslop-Windows-portable${{ startsWith(github.ref, 'refs/tags/v') && '-UNSIGNED' || '' }}
          path: |
            dist/portable-windows/*.zip
            dist/portable-windows/*.sha256
            dist/portable-windows/*.json
            dist/portable-windows/THIRD_PARTY_NOTICES.md

  # A tag push runs this workflow directly, so the portable builders alone used
  # to decide whether release assets were published. `ci` and `security` only
  # trigger on pull requests and pushes to main, which means a tag cut on any
  # other commit — or pushed before main's run settled — published without the
  # suite, lint, dependency audit, or static security checks ever passing.
  # docs/v1/distribution.md already required them to be green; this enforces it.
  #
  # `performance` is deliberately not required: it only runs on a schedule or
  # manual dispatch, so demanding it here would deadlock every release.
  verify-checks:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # `actions: read` is what lets `gh api .../actions/workflows/.../runs`
      # read the conclusion of the ci and security runs for the tagged commit.
      # Nothing here writes, and no checkout is needed.
      actions: read
    steps:
      - name: Require green ci and security runs for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_WORKFLOWS: test.yml security.yml
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while :; do
            pending=""
            for workflow in ${REQUIRED_WORKFLOWS}; do
              # `set -e` would abort the whole job on a transient API error —
              # rate limit, 5xx, dropped connection — turning a blip into a
              # failed release that needs the tag build re-run by hand. Treat a
              # failed query like a pending run and let the loop retry it.
              if ! state=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&per_page=1" \
                --jq '(.workflow_runs[0] // {}) | "\(.status // "missing"):\(.conclusion // "none")"'); then
                echo "${workflow}: status query failed, retrying"
                pending="${pending} ${workflow}"
                continue
              fi
              case "${state}" in
                completed:success)
                  echo "${workflow}: success"
                  ;;
                completed:*)
                  echo "::error::${workflow} concluded '${state#*:}' for ${GITHUB_SHA} — refusing to publish release assets"
                  exit 1
                  ;;
                *)
                  pending="${pending} ${workflow}"
                  ;;
              esac
            done
            if [ -z "${pending}" ]; then
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::timed out after 30m waiting for:${pending} — a job in it is probably hung; every job in those workflows is capped below 30m, so check for a cancelled or stuck runner rather than assuming slowness"
              exit 1
            fi
            echo "waiting for:${pending}"
            sleep 30
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, verify-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No step here pushes; gh authenticates with GH_TOKEN. Leaving the
        # write-capable token in .git/config would only widen what a later
        # step — or a packaged artifact — could reach.
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Photoslop-macOS-portable${{ github.ref_name == 'v1.30.0' && '-SIGNED-NOT-NOTARIZED' || '' }}
          path: dist/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Photoslop-Windows-portable${{ startsWith(github.ref, 'refs/tags/v') && '-UNSIGNED' || '' }}
          path: dist/windows
      - name: Give platform metadata unique release names
        run: |
          mv dist/macos/photoslop.cdx.json dist/macos/Photoslop-macOS.cdx.json
          mv dist/macos/BUILD-IDENTITY.json dist/macos/Photoslop-macOS-BUILD-IDENTITY.json
          mv dist/macos/THIRD_PARTY_NOTICES.md dist/macos/Photoslop-macOS-THIRD_PARTY_NOTICES.md
          mv dist/windows/photoslop.cdx.json dist/windows/Photoslop-Windows.cdx.json
          mv dist/windows/BUILD-IDENTITY.json dist/windows/Photoslop-Windows-BUILD-IDENTITY.json
          mv dist/windows/THIRD_PARTY_NOTICES.md dist/windows/Photoslop-Windows-THIRD_PARTY_NOTICES.md
      - name: Attest portable archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/**/*.zip"
      # `gh release upload` requires the release to exist already, so a tag whose
      # release had not been hand-created failed here with "release not found"
      # after every build had succeeded — the assets were built, attested, and
      # then dropped. Create it when missing so tagging is the only manual step.
      - name: Attach portable builds and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "Photoslop ${GITHUB_REF_NAME}" \
              --verify-tag \
              --notes "Portable builds for ${GITHUB_REF_NAME}. See CHANGELOG.md."
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            dist/macos/* dist/windows/* --clobber
