name: iPadOS

on:
  pull_request:
    paths:
      - "ipados/**"
      - "scripts/build-ipados.sh"
      - ".github/workflows/ipados.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release versions
        run: python3 scripts/check-version.py
      - name: Install XcodeGen
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$archive"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $archive" \
            | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/xcodegen-release"
          ditto -x -k "$archive" "$RUNNER_TEMP/xcodegen-release"
          echo "XCODEGEN=$RUNNER_TEMP/xcodegen-release/xcodegen/bin/xcodegen" \
            >> "$GITHUB_ENV"
      - name: Build iPadOS app
        run: scripts/build-ipados.sh
      # The app is universal, and the two size classes take different code
      # paths: a regular width keeps the layer sidebar beside the canvas, a
      # compact one moves it into a sheet. Testing only an iPad would leave the
      # phone layout uncovered.
      - name: Select simulators
        id: simulator
        run: |
          # Pinned by name, not "whichever iPad is first in the list".
          #
          # The unpinned form silently tested whatever the runner image happened
          # to ship, so nobody could reproduce a failure without first reading
          # the log to find out what had been tested. It also hid a worse
          # problem: the runner's simulators are iOS 18.5 while a development
          # machine on current Xcode has 26.x, and SwiftUI gesture delivery
          # inside a scroll view differs between them. Four CI failures passed
          # locally before that was noticed. `scripts/ci-local.sh` pins the same
          # two devices and the same runtime, so a green run there means this.
          devices="$(xcrun simctl list devices available -j)"
          IPAD_ID="$(echo "$devices" | jq -r \
            '[.devices[][] | select(.name == "iPad Pro 11-inch (M4)")][0].udid')"
          IPHONE_ID="$(echo "$devices" | jq -r \
            '[.devices[][] | select(.name == "iPhone 16 Pro")][0].udid')"
          # Fall back rather than fail the run if a runner image drops a model,
          # and say so loudly, because the pin is the point.
          if [ -z "$IPAD_ID" ] || [ "$IPAD_ID" = "null" ]; then
            echo "::warning::pinned iPad missing from this runner; falling back"
            IPAD_ID="$(echo "$devices" | jq -r \
              '[.devices[][] | select(.name | startswith("iPad"))][0].udid')"
          fi
          if [ -z "$IPHONE_ID" ] || [ "$IPHONE_ID" = "null" ]; then
            echo "::warning::pinned iPhone missing from this runner; falling back"
            IPHONE_ID="$(echo "$devices" | jq -r \
              '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          fi
          for id in "$IPAD_ID" "$IPHONE_ID"; do
            test -n "$id" -a "$id" != "null"
          done
          xcrun simctl list devices available | grep -E "$IPAD_ID|$IPHONE_ID"
          echo "ipad=$IPAD_ID" >> "$GITHUB_OUTPUT"
          echo "iphone=$IPHONE_ID" >> "$GITHUB_OUTPUT"
      # Two iterations, and for exactly one failure mode: the XCTest daemon
      # failing to bring up a UI-testing session at all —
      #
      #   Failed to initialize for UI testing: XCTDaemonErrorDomain Code=19
      #   "Failed call to AXDisableAccessibilityOnTermination"
      #
      # Zero tests execute when that happens. There is no app involved, no
      # assertion to wait on, and nothing test code can reach; retrying the
      # invocation is the only remedy available to us.
      #
      # Every cause that was about this project is fixed rather than absorbed: a
      # narrow iPad overflowing its navigation bar and losing Export (#227 one
      # size class up — the overflowing test was never the failing one, so the
      # *next* test timed out and it looked like a race); every test inheriting
      # the documents the last one made; a layer-count assertion racing an async
      # decode; queries enumerating the system document browser's hierarchy until
      # XCTest could not snapshot them; a cold simulator charging its
      # first-document cost to whichever test ran first; and the canvas-size
      # question being asked more than once. The suite passes with no retries at
      # all on erased simulators, and the iPad leg passed here with none.
      #
      # Keep this number at two. The lower it is, the less room there is for the
      # next real defect to hide as flakiness — which is what it was doing to
      # #227 for months.
      # The export-to-Photos tests need permission to add to the photo library;
      # without it the save stalls on the system consent dialog and the test
      # reports "no confirmation", which is true and nothing to do with the code
      # under test. This is the same thing a developer does by hand before
      # running them locally.
      #
      # Granted per device, immediately before that device's own tests. Booting
      # both simulators up front to do it in one step left two running for the
      # whole job and the runner starved — unrelated tests began failing on "the
      # editor never came up" and accessibility actions timed out. One simulator
      # at a time is what xcodebuild would have done on its own.
      - name: Allow the iPad simulator to add to the photo library
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.ipad }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.ipad }}' -b
          xcrun simctl privacy '${{ steps.simulator.outputs.ipad }}' \
            grant photos-add io.ronin48.photoslop.ipad
      - name: Run iPad tests
        working-directory: ipados
        run: |
          xcodebuild \
            -project Photoslop-iPadOS.xcodeproj \
            -scheme PhotoslopIPad \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.ipad }}' \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test
      # Granted per device, immediately before its own tests. Booting both
      # simulators up front to do this in one step left two of them running for
      # the whole job, and the runner starved: unrelated tests started failing on
      # "the editor never came up" and accessibility actions timed out. One
      # simulator at a time is how xcodebuild would have done it.
      - name: Shut down the iPad simulator
        if: always()
        run: xcrun simctl shutdown '${{ steps.simulator.outputs.ipad }}' || true
      - name: Allow the iPhone simulator to add to the photo library
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.iphone }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.iphone }}' -b
          xcrun simctl privacy '${{ steps.simulator.outputs.iphone }}' \
            grant photos-add io.ronin48.photoslop.ipad
      - name: Run iPhone tests
        working-directory: ipados
        run: |
          xcodebuild \
            -project Photoslop-iPadOS.xcodeproj \
            -scheme PhotoslopIPad \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.iphone }}' \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Photoslop-iPadOS-unsigned-validation-only
          path: ipados/dist/Photoslop-iPadOS-unsigned.zip

  testflight:
    name: TestFlight upload
    needs: build
    if: github.ref_type == 'tag'
    runs-on: macos-15
    environment: testflight
    env:
      PHOTOSLOP_IOS_TEAM_ID: J6P99Q4479
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # App Store Connect rejects anything built against an older SDK:
      # "All iOS and iPadOS apps must be built with the iOS 26 SDK or later."
      # The runner image's default Xcode is older than that, so pick the newest
      # Xcode 26+ explicitly and fail loudly, listing what is installed, rather
      # than archiving with the wrong SDK and only learning at upload.
      - name: Select an Xcode with the iOS 26 SDK
        run: |
          newest=""
          for candidate in /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app; do
            [ -d "$candidate" ] || continue
            newest="$candidate"
          done
          if [ -z "$newest" ]; then
            echo "::error::No Xcode 26 or newer on this runner; App Store Connect requires the iOS 26 SDK"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $newest"
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
      - name: Verify release versions
        run: python3 scripts/check-version.py
      - name: Install XcodeGen
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$archive"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $archive" \
            | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/xcodegen-release"
          ditto -x -k "$archive" "$RUNNER_TEMP/xcodegen-release"
          echo "XCODEGEN=$RUNNER_TEMP/xcodegen-release/xcodegen/bin/xcodegen" \
            >> "$GITHUB_ENV"
      - name: Import Apple Distribution identity
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: scripts/import-ios-signing-certificate.sh
      - name: Archive, export, and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: scripts/publish-ipados-testflight.sh
      # Cloud signing on an ephemeral keychain mints a fresh Apple
      # Development certificate ("Created via API") every release and can
      # never reuse the last one; at the account limit of 15 the archive fails
      # with "choose a certificate to revoke" after the tests have passed
      # (#255). Pinning the archive to the distribution identity instead was
      # tried and Xcode refuses it under automatic signing (v2.10.0), so this
      # step is the fix: it drains the throwaways after every upload. It
      # cannot fail the release: by now the build is on TestFlight, and the
      # script downgrades every API problem to a warning.
      - name: Revoke the throwaway development certificates cloud signing minted
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 scripts/revoke-ci-development-certificates.py
